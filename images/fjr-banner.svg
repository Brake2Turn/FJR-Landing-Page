<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 300"
  width="1600"
  height="300"
  role="img"
  aria-label="First Job Ready">
  <title>First Job Ready</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35543F" />
      <stop offset="60%" stop-color="#2F4A3B" />
      <stop offset="100%" stop-color="#263C30" />
    </linearGradient>
  </defs>

  <rect width="1600" height="300" fill="url(#bg)" />

  <!-- Soft decorative arcs in sage, kept very low contrast -->
  <g fill="none" stroke="#5B8C6E" stroke-opacity="0.28" stroke-width="2">
    <circle cx="1380" cy="60" r="150" />
    <circle cx="1380" cy="60" r="230" />
    <circle cx="200" cy="270" r="120" />
  </g>

  <!-- Wordmark: serif, per the brand guide's logo direction -->
  <text
    x="80"
    y="150"
    font-family="Lora, Georgia, 'Times New Roman', serif"
    font-size="76"
    font-weight="700"
    fill="#FAF6F0">
    First Job Ready
  </text>

  <text
    x="82"
    y="200"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#FAF6F0"
    fill-opacity="0.78">
    Interview coaching for Perth teens
  </text>

  <rect x="82" y="228" width="88" height="4" rx="2" fill="#D98B5F" />
</svg>
